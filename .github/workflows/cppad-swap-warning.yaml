# Brad Bell's swap.sh (coin-or/CppAD#259) on GCC 14/15/16, Windows Rtools
# g++, MSYS2 MinGW g++, and macOS Apple Clang, plus the sparse_rc move that
# also includes Eigen. Apple Clang does not warn on that move.
# GCC, Rtools, and MSYS2 MinGW also compile that move against upstream CppAD 302e241.
# gcc:14 strips the initializer and requires the uninitialized warning.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cppad-swap-warning.yaml
      - .github/scripts/cppad-swap.sh
      - .github/scripts/cppad-sparse-rc-move.sh
      - .github/scripts/cppad-sparse-rc-upstream.sh
      - sparse_rc_move.cpp

name: CppAD swap warning

permissions:
  contents: read

jobs:
  gcc-image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      # Official gcc images set ENTRYPOINT ["gcc"], which breaks later steps.
      options: --entrypoint ""
    strategy:
      fail-fast: false
      matrix:
        image: [gcc:14, gcc:15, gcc:16]

    defaults:
      run:
        shell: bash

    steps:
      # checkout is a JS action, but it shells out to git, which the gcc image lacks.
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compiler version
        run: g++ --version

      - name: Run Brad's swap.sh
        run: |
          work="$(mktemp -d)"
          cd "$work"
          bash "$GITHUB_WORKSPACE/.github/scripts/cppad-swap.sh"

      - name: Test upstream CppAD 302e241
        run: |
          work="$(mktemp -d)"
          cd "$work"
          bash "$GITHUB_WORKSPACE/.github/scripts/cppad-sparse-rc-upstream.sh"

      # Only gcc:14. The step passes when the stripped move constructor warns.
      - name: Negative control (stripped initializer must warn)
        if: matrix.image == 'gcc:14'
        run: |
          work="$(mktemp -d)"
          cd "$work"
          log="$(mktemp)"
          set +e
          bash "$GITHUB_WORKSPACE/.github/scripts/cppad-sparse-rc-move.sh" >"$log" 2>&1
          status=$?
          set -e
          cat "$log"
          if [ "$status" -eq 0 ]; then
            echo "expected -Wuninitialized after stripping the initializer" >&2
            exit 1
          fi
          if ! grep -q 'uninitialized' "$log"; then
            echo "strip-initializer compile failed without -Wuninitialized" >&2
            exit 1
          fi

  rtools-swap:
    name: windows Rtools g++ (swap.sh)
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Compiler version
        run: |
          command -v g++
          g++ --version

      - name: Run Brad's swap.sh
        run: |
          work="$(mktemp -d)"
          cd "$work"
          bash "$GITHUB_WORKSPACE/.github/scripts/cppad-swap.sh"

      - name: Test upstream CppAD 302e241
        run: |
          work="$(mktemp -d)"
          cd "$work"
          bash "$GITHUB_WORKSPACE/.github/scripts/cppad-sparse-rc-upstream.sh"

  mingw-swap:
    name: windows mingw g++
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Stock MinGW-w64 from MSYS2, not the Rtools toolchain.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Compiler version
        run: |
          command -v g++
          g++ --version

      - name: Run Brad's swap.sh
        run: |
          work="$(mktemp -d)"
          cd "$work"
          bash "$GITHUB_WORKSPACE/.github/scripts/cppad-swap.sh"

      - name: Test upstream CppAD 302e241
        run: |
          work="$(mktemp -d)"
          cd "$work"
          bash "$GITHUB_WORKSPACE/.github/scripts/cppad-sparse-rc-upstream.sh"

  macos-clang:
    name: macos Apple Clang
    runs-on: macos-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compiler version
        run: |
          command -v g++
          g++ --version

      # Apple Clang rejects -Wlogical-op, -Wduplicated-cond, and
      # -Wduplicated-branches. Drop only those flags; the GCC jobs keep them.
      - name: Run Brad's swap.sh
        run: |
          work="$(mktemp -d)"
          cd "$work"
          sed -e '/-Wlogical-op/d' -e '/-Wduplicated-cond/d' -e '/-Wduplicated-branches/d' \
            "$GITHUB_WORKSPACE/.github/scripts/cppad-swap.sh" > swap-clang.sh
          bash swap-clang.sh

      - name: Run sparse_rc move repro
        run: |
          work="$(mktemp -d)"
          cd "$work"
          bash "$GITHUB_WORKSPACE/.github/scripts/cppad-sparse-rc-move.sh"
