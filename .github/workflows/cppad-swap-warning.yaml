# Brad Bell's swap.sh (coin-or/CppAD#259) on GCC 14/15/16 and on Windows
# Rtools g++, plus the sparse_rc move that also includes Eigen.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cppad-swap-warning.yaml
      - .github/scripts/cppad-swap.sh
      - .github/scripts/cppad-sparse-rc-move.sh

name: CppAD swap warning

permissions:
  contents: read

jobs:
  gcc-image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      # Official gcc images set ENTRYPOINT ["gcc"], which breaks later steps.
      options: --entrypoint ""
    strategy:
      fail-fast: false
      matrix:
        image: [gcc:14, gcc:15, gcc:16]

    defaults:
      run:
        shell: bash

    steps:
      # checkout is a JS action, but it shells out to git, which the gcc image lacks.
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl

      - uses: actions/checkout@v6

      - name: Compiler version
        run: g++ --version

      - name: Run Brad's swap.sh
        run: |
          work="$(mktemp -d)"
          cd "$work"
          bash "$GITHUB_WORKSPACE/.github/scripts/cppad-swap.sh"

      - name: Run sparse_rc move repro
        run: |
          work="$(mktemp -d)"
          cd "$work"
          bash "$GITHUB_WORKSPACE/.github/scripts/cppad-sparse-rc-move.sh"

  rtools-swap:
    name: windows Rtools g++ (swap.sh)
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Compiler version
        run: |
          command -v g++
          g++ --version

      - name: Run Brad's swap.sh
        run: |
          work="$(mktemp -d)"
          cd "$work"
          bash "$GITHUB_WORKSPACE/.github/scripts/cppad-swap.sh"

      - name: Run sparse_rc move repro
        run: |
          work="$(mktemp -d)"
          cd "$work"
          bash "$GITHUB_WORKSPACE/.github/scripts/cppad-sparse-rc-move.sh"
