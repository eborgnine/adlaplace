# Brad Bell's swap.sh (coin-or/CppAD#259) on GCC 14/15/16 and on Windows
# Rtools g++. On Rtools only, a sparse_rc move that also includes Eigen
# (the shape of the adlaplace warning). Plus the CRAN-shaped case: Rtools
# compiling current adlaplace against RCppAD before the sparse_rc move-ctor
# initializer (b804867).
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cppad-swap-warning.yaml
      - .github/scripts/cppad-swap.sh
      - .github/scripts/cppad-sparse-rc-move.sh

name: CppAD swap warning

permissions:
  contents: read

jobs:
  gcc-image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      # Official gcc images set ENTRYPOINT ["gcc"], which breaks later steps.
      options: --entrypoint ""
    strategy:
      fail-fast: false
      matrix:
        image: [gcc:14, gcc:15, gcc:16]

    defaults:
      run:
        shell: bash

    steps:
      # checkout is a JS action, but it shells out to git, which the gcc image lacks.
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v6

      - name: Compiler version
        run: g++ --version

      - name: Run Brad's swap.sh
        run: |
          work="$(mktemp -d)"
          cd "$work"
          bash "$GITHUB_WORKSPACE/.github/scripts/cppad-swap.sh"

  rtools-swap:
    name: windows Rtools g++ (swap.sh)
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Compiler version
        run: |
          command -v g++
          g++ --version

      - name: Run Brad's swap.sh
        run: |
          work="$(mktemp -d)"
          cd "$work"
          bash "$GITHUB_WORKSPACE/.github/scripts/cppad-swap.sh"

      - name: Run sparse_rc move repro
        run: |
          work="$(mktemp -d)"
          cd "$work"
          bash "$GITHUB_WORKSPACE/.github/scripts/cppad-sparse-rc-move.sh"

  rtools:
    name: windows Rtools adlaplace
    runs-on: windows-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure configure/cleanup are executable
        run: |
          find . -maxdepth 2 \( -name configure -o -name cleanup -o -name configure.win -o -name cleanup.win \) \
            -type f -exec chmod +x {} +

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Compiler version
        run: |
          command -v g++
          g++ --version

      # pak, without installing adlaplace's own deps (install-cran-deps does that
      # and skips the local packages). RCppAD Depends only on R.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: RCppAD
          packages: any::pak
          install-quarto: false

      - name: Install CRAN deps (RCppAD + adlaplace only)
        run: Rscript .github/scripts/install-cran-deps.R RCppAD adlaplace

      - name: Install pre-fix RCppAD and current adlaplace
        run: |
          set -o pipefail
          rm -rf RCppAD
          git archive b80486726a580fbd2820a3dbed73c183bbc3c526 RCppAD | tar -x
          # The default ctor already has this initializer. Only the move ctor must not.
          move_next=$(grep -A1 'sparse_rc(sparse_rc&& other)' RCppAD/inst/include/cppad/utility/sparse_rc.hpp | tail -n 1)
          case "$move_next" in
            *'nr_(0), nc_(0), nnz_(0)'*)
              echo "pre-fix tree still has the sparse_rc move-ctor initializer"
              exit 1
              ;;
          esac
          bash .github/scripts/install-local-pkg.sh RCppAD
          bash .github/scripts/install-local-pkg.sh adlaplace 2>&1 | tee adlaplace-install.log

      # R CMD INSTALL exits 0 on a warning. Green means the diagnostic came back.
      - name: Require the uninitialized warning
        run: |
          if ! grep -q "used uninitialized" adlaplace-install.log; then
            echo "expected -Wuninitialized ('used uninitialized') in the adlaplace install log"
            exit 1
          fi
          echo "Reproduced: adlaplace compile log contains 'used uninitialized'"

      - name: Upload adlaplace install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-adlaplace-pre-fix-rcppad
          path: adlaplace-install.log
          if-no-files-found: warn
