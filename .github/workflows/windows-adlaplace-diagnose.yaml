# Windows-only: isolate latch side-effects vs the old 15→22 hard abort.
# Installs local RCppAD + adlaplace, then runs suite/owner-modulo variants.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'   # Sundays 03:00 UTC (after main R-CMD-check)

name: Windows-adlaplace-diagnose

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    name: windows adlaplace test diagnose

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Ensure configure/cleanup are executable
        run: |
          find . -maxdepth 2 \( -name configure -o -name cleanup -o -name configure.win -o -name cleanup.win \) \
            -type f -exec chmod +x {} +

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::rcmdcheck, any::testthat
          install-quarto: false

      - name: Install CRAN deps (RCppAD + adlaplace only)
        run: Rscript .github/scripts/install-cran-deps.R RCppAD adlaplace

      - name: Build and install RCppAD
        run: bash .github/scripts/install-local-pkg.sh RCppAD

      - name: Build and install adlaplace
        run: bash .github/scripts/install-local-pkg.sh adlaplace

      - name: Diagnose owner latch vs abort
        run: bash .github/scripts/diagnose-adlaplace-windows.sh

      - name: Upload matrix results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diagnose-matrix-results
          path: .matrix-results.txt
          if-no-files-found: ignore
