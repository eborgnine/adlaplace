# Windows-only: time adlaplace vignettes at 1 vs 4 OpenMP threads.
# Installs local RCppAD + adlaplace (OpenMP), then knits every vignette twice.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'   # Sundays 03:00 UTC

name: Windows-adlaplace-diagnose

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    name: windows vignette 1 vs 4 threads

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: 'true'

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Ensure configure/cleanup are executable
        run: |
          find . -maxdepth 2 \( -name configure -o -name cleanup -o -name configure.win -o -name cleanup.win \) \
            -type f -exec chmod +x {} +

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: adlaplace
          extra-packages: any::rmarkdown, any::knitr
          needs: vignette
          install-quarto: false

      - name: Install CRAN deps (RCppAD + adlaplace only)
        run: Rscript .github/scripts/install-cran-deps.R RCppAD adlaplace

      - name: Build and install RCppAD
        run: bash .github/scripts/install-local-pkg.sh RCppAD

      - name: Build and install adlaplace
        run: bash .github/scripts/install-local-pkg.sh adlaplace

      - name: Time vignettes at 1 vs 4 threads
        run: bash .github/scripts/diagnose-adlaplace-windows.sh

      - name: Upload vignette timing results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-vignette-timing
          path: |
            .vignette-timing.txt
            .vignette-out/
          if-no-files-found: ignore
