# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Checks local packages in order:
#   RCppAD → adlaplace → adlaplaceExample → adlaplaceHgp → adlaplaceGrf → hpolcc
# Each package is checked twice per pass: plain, then --as-cran.
# Jobs:
#   - macOS: first pass without Homebrew libomp, then brew install libomp and re-check
#   - Windows
#   - Ubuntu CRAN-like (R-hub ubuntu-release); finally install INLA and re-check adlaplaceGrf
on:
  schedule:
    - cron: '0 2 * * 0'   # Sundays 02:00 UTC
  workflow_dispatch:

name: R-CMD-check

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    container: ${{ matrix.config.container }}

    name: ${{ matrix.config.label }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - os: macos-latest
            r: 'release'
            id: macos
            label: 'macos-latest (no OpenMP, then OpenMP)'
          - os: windows-latest
            r: 'release'
            id: windows
            label: 'windows-latest (release)'
          - os: ubuntu-latest
            r: 'release'
            id: ubuntu-cran
            label: 'ubuntu-release (CRAN-like)'
            container: ghcr.io/r-hub/containers/ubuntu-release:latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    # bash so `R CMD INSTALL` is not eaten by PowerShell's `R` → Invoke-History alias
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # Host jobs only: R-hub images already ship R (and usually pandoc).
      - uses: r-lib/actions/setup-pandoc@v2
        if: ${{ matrix.config.container == null }}

      - uses: r-lib/actions/setup-r@v2
        if: ${{ matrix.config.container == null }}
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # macOS: deliberately skip libomp for the first pass (configure soft-fails).
      - name: Install OpenMP (CRAN-like container)
        if: ${{ matrix.config.container != null }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libomp-dev curl ca-certificates

      - uses: r-lib/actions/setup-tinytex@v2

      # Use R's tinytex wrapper: bare `tlmgr` is often missing from bash PATH on Windows.
      - name: Install TinyTeX extras
        shell: Rscript {0}
        run: tinytex::tlmgr_install("makeindex")

      # Install the union of all packages' check deps once (pak skips what's already ok).
      # Local packages are still built/checked later; installs use built .tar.gz
      # (see .github/scripts/install-local-pkg.sh).
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            deps::RCppAD
            deps::adlaplace
            deps::adlaplaceExample
            deps::adlaplaceHgp
            deps::adlaplaceGrf
            deps::hpolcc
          extra-packages: any::rcmdcheck
          needs: check

      # =====================================================================
      # Pass 1 (all jobs): macOS has no Homebrew libomp yet
      # =====================================================================

      # ----- RCppAD -----
      - name: Check RCppAD (plain)
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: RCppAD
          upload-snapshots: true
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual")'
          check-dir: '"check-plain"'
          artifact-name: ${{ matrix.config.id }}-pass1-RCppAD-plain

      - name: Check RCppAD (as-cran)
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: RCppAD
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual")'
          check-dir: '"check-as-cran"'
          artifact-name: ${{ matrix.config.id }}-pass1-RCppAD-as-cran

      - name: Install RCppAD
        run: bash .github/scripts/install-local-pkg.sh RCppAD

      # ----- adlaplace -----
      - name: Check adlaplace (plain)
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: adlaplace
          upload-snapshots: true
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"check-plain"'
          artifact-name: ${{ matrix.config.id }}-pass1-adlaplace-plain

      - name: Check adlaplace (as-cran)
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: adlaplace
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"check-as-cran"'
          artifact-name: ${{ matrix.config.id }}-pass1-adlaplace-as-cran

      - name: Install adlaplace
        run: bash .github/scripts/install-local-pkg.sh adlaplace

      # ----- adlaplaceExample -----
      - name: Check adlaplaceExample (plain)
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: adlaplaceExample
          upload-snapshots: true
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"check-plain"'
          artifact-name: ${{ matrix.config.id }}-pass1-adlaplaceExample-plain

      - name: Check adlaplaceExample (as-cran)
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: adlaplaceExample
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"check-as-cran"'
          artifact-name: ${{ matrix.config.id }}-pass1-adlaplaceExample-as-cran

      # ----- adlaplaceHgp -----
      - name: Check adlaplaceHgp (plain)
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: adlaplaceHgp
          upload-snapshots: true
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual")'
          check-dir: '"check-plain"'
          artifact-name: ${{ matrix.config.id }}-pass1-adlaplaceHgp-plain

      - name: Check adlaplaceHgp (as-cran)
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: adlaplaceHgp
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual")'
          check-dir: '"check-as-cran"'
          artifact-name: ${{ matrix.config.id }}-pass1-adlaplaceHgp-as-cran

      - name: Install adlaplaceHgp
        run: bash .github/scripts/install-local-pkg.sh adlaplaceHgp

      # ----- adlaplaceGrf -----
      - name: Check adlaplaceGrf (plain)
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: adlaplaceGrf
          upload-snapshots: true
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"check-plain"'
          artifact-name: ${{ matrix.config.id }}-pass1-adlaplaceGrf-plain

      - name: Check adlaplaceGrf (as-cran)
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: adlaplaceGrf
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"check-as-cran"'
          artifact-name: ${{ matrix.config.id }}-pass1-adlaplaceGrf-as-cran

      # ----- hpolcc -----
      - name: Check hpolcc (plain)
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: hpolcc
          upload-snapshots: true
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"check-plain"'
          artifact-name: ${{ matrix.config.id }}-pass1-hpolcc-plain

      - name: Check hpolcc (as-cran)
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: hpolcc
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"check-as-cran"'
          artifact-name: ${{ matrix.config.id }}-pass1-hpolcc-as-cran

      # =====================================================================
      # Pass 2 (macOS only): install libomp, rebuild, re-check
      # =====================================================================

      - name: Install OpenMP (macOS, second pass)
        if: runner.os == 'macOS'
        run: brew install libomp

      # Rebuild installed compiled deps so LinkingTo backends see OpenMP-enabled libs.
      - name: Reinstall adlaplace with OpenMP
        if: runner.os == 'macOS'
        run: bash .github/scripts/install-local-pkg.sh adlaplace

      - name: Reinstall adlaplaceHgp
        if: runner.os == 'macOS'
        run: bash .github/scripts/install-local-pkg.sh adlaplaceHgp

      - name: Check RCppAD with OpenMP (plain)
        if: runner.os == 'macOS'
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: RCppAD
          upload-snapshots: true
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual")'
          check-dir: '"check-plain-omp"'
          artifact-name: macos-pass2-RCppAD-plain

      - name: Check RCppAD with OpenMP (as-cran)
        if: runner.os == 'macOS'
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: RCppAD
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual")'
          check-dir: '"check-as-cran-omp"'
          artifact-name: macos-pass2-RCppAD-as-cran

      - name: Check adlaplace with OpenMP (plain)
        if: runner.os == 'macOS'
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: adlaplace
          upload-snapshots: true
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"check-plain-omp"'
          artifact-name: macos-pass2-adlaplace-plain

      - name: Check adlaplace with OpenMP (as-cran)
        if: runner.os == 'macOS'
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: adlaplace
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"check-as-cran-omp"'
          artifact-name: macos-pass2-adlaplace-as-cran

      - name: Reinstall adlaplace after OpenMP check
        if: runner.os == 'macOS'
        run: bash .github/scripts/install-local-pkg.sh adlaplace

      - name: Check adlaplaceExample with OpenMP (plain)
        if: runner.os == 'macOS'
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: adlaplaceExample
          upload-snapshots: true
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"check-plain-omp"'
          artifact-name: macos-pass2-adlaplaceExample-plain

      - name: Check adlaplaceExample with OpenMP (as-cran)
        if: runner.os == 'macOS'
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: adlaplaceExample
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"check-as-cran-omp"'
          artifact-name: macos-pass2-adlaplaceExample-as-cran

      - name: Check adlaplaceHgp with OpenMP (plain)
        if: runner.os == 'macOS'
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: adlaplaceHgp
          upload-snapshots: true
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual")'
          check-dir: '"check-plain-omp"'
          artifact-name: macos-pass2-adlaplaceHgp-plain

      - name: Check adlaplaceHgp with OpenMP (as-cran)
        if: runner.os == 'macOS'
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: adlaplaceHgp
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual")'
          check-dir: '"check-as-cran-omp"'
          artifact-name: macos-pass2-adlaplaceHgp-as-cran

      - name: Reinstall adlaplaceHgp after OpenMP check
        if: runner.os == 'macOS'
        run: bash .github/scripts/install-local-pkg.sh adlaplaceHgp

      - name: Check adlaplaceGrf with OpenMP (plain)
        if: runner.os == 'macOS'
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: adlaplaceGrf
          upload-snapshots: true
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"check-plain-omp"'
          artifact-name: macos-pass2-adlaplaceGrf-plain

      - name: Check adlaplaceGrf with OpenMP (as-cran)
        if: runner.os == 'macOS'
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: adlaplaceGrf
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"check-as-cran-omp"'
          artifact-name: macos-pass2-adlaplaceGrf-as-cran

      - name: Check hpolcc with OpenMP (plain)
        if: runner.os == 'macOS'
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: hpolcc
          upload-snapshots: true
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"check-plain-omp"'
          artifact-name: macos-pass2-hpolcc-plain

      - name: Check hpolcc with OpenMP (as-cran)
        if: runner.os == 'macOS'
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: hpolcc
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"check-as-cran-omp"'
          artifact-name: macos-pass2-hpolcc-as-cran

      # =====================================================================
      # Linux CRAN-like only: install INLA, re-check adlaplaceGrf (vignettes)
      # =====================================================================

      - name: Install INLA
        if: ${{ matrix.config.id == 'ubuntu-cran' }}
        shell: Rscript {0}
        run: |
          install.packages(
            "INLA",
            repos = c(
              getOption("repos"),
              INLA = "https://inla.r-inla-download.org/R/stable"
            ),
            dependencies = TRUE
          )
          stopifnot(requireNamespace("INLA", quietly = TRUE))

      - name: Check adlaplaceGrf with INLA (plain)
        if: ${{ matrix.config.id == 'ubuntu-cran' }}
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: adlaplaceGrf
          upload-snapshots: true
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"check-plain-inla"'
          artifact-name: ubuntu-cran-adlaplaceGrf-inla-plain

      - name: Check adlaplaceGrf with INLA (as-cran)
        if: ${{ matrix.config.id == 'ubuntu-cran' }}
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: adlaplaceGrf
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"check-as-cran-inla"'
          artifact-name: ubuntu-cran-adlaplaceGrf-inla-as-cran
