# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Checks local packages in order:
#   RCppAD → adlaplace → adlaplaceExample → adlaplaceHgp → adlaplaceGrf → hpolcc
# Per package: build+install, then check plain, then check --as-cran
# (Windows: plain check only; skip --as-cran).
# Jobs:
#   - macOS: first pass without Homebrew libomp, then brew install libomp and re-check
#   - Windows (plain checks only)
#   - Ubuntu CRAN-like (R-hub ubuntu-release); finally install INLA and re-check adlaplaceGrf
#   - deploy-docs: GitHub Pages from ubuntu-built vignette HTML (_site/)
# Check output goes under .ci-check/ (never inside package source trees).
on:
  schedule:
    - cron: '0 2 * * 0'   # Sundays 02:00 UTC
  workflow_dispatch:

name: R-CMD-check

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    container: ${{ matrix.config.container }}

    name: ${{ matrix.config.label }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - os: macos-latest
            r: 'release'
            id: macos
            label: 'macos-latest (no OpenMP, then OpenMP)'
          - os: windows-latest
            r: 'release'
            id: windows
            label: 'windows-latest (release)'
          - os: ubuntu-latest
            r: 'release'
            id: ubuntu-cran
            label: 'ubuntu-release (CRAN-like)'
            container: ghcr.io/r-hub/containers/ubuntu-release:latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    # bash so `R CMD INSTALL` is not eaten by PowerShell's `R` → Invoke-History alias
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      # Windows checkout often drops Unix +x; R CMD build warns and "corrects" otherwise.
      - name: Ensure configure/cleanup are executable
        run: |
          find . -maxdepth 2 \( -name configure -o -name cleanup -o -name configure.win -o -name cleanup.win \) \
            -type f -exec chmod +x {} +

      # Host jobs only: R-hub images already ship R (and usually pandoc).
      - uses: r-lib/actions/setup-pandoc@v2
        if: ${{ matrix.config.container == null }}

      - uses: r-lib/actions/setup-r@v2
        if: ${{ matrix.config.container == null }}
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # macOS: deliberately skip libomp for the first pass (configure soft-fails).
      - name: Install OpenMP (CRAN-like container)
        if: ${{ matrix.config.container != null }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libomp-dev curl ca-certificates

      # HTML knitr vignettes do not need TeX/TinyTeX (avoids Windows/macOS tlmgr PATH issues).

      # Install pak + rcmdcheck only. Local packages are built/installed later in order.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::rcmdcheck
          install-quarto: false

      # Union of DESCRIPTION deps across local packages, excluding the locals themselves.
      - name: Install CRAN dependencies (exclude local packages)
        run: Rscript .github/scripts/install-cran-deps.R

      # =====================================================================
      # Pass 1 (all jobs): macOS has no Homebrew libomp yet
      # Per package: build+install → check plain → check --as-cran (not Windows)
      # =====================================================================

      # ----- RCppAD -----
      - name: Build and install RCppAD
        run: bash .github/scripts/install-local-pkg.sh RCppAD

      - name: Check RCppAD (plain)
        uses: r-lib/actions/check-r-package@v2
        with:
          # Our check dirs live at ../.ci-check/; the action's failure-time
          # artifact upload cannot handle '..' in paths, so keep it off.
          upload-results: never
          working-directory: RCppAD
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual")'
          check-dir: '"../.ci-check/RCppAD-plain"'
          artifact-name: ${{ matrix.config.id }}-pass1-RCppAD-plain

      - name: Check RCppAD (as-cran)
        if: runner.os != 'Windows'
        uses: r-lib/actions/check-r-package@v2
        with:
          # Our check dirs live at ../.ci-check/; the action's failure-time
          # artifact upload cannot handle '..' in paths, so keep it off.
          upload-results: never
          working-directory: RCppAD
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual")'
          check-dir: '"../.ci-check/RCppAD-as-cran"'
          artifact-name: ${{ matrix.config.id }}-pass1-RCppAD-as-cran

      # ----- adlaplace -----
      - name: Build and install adlaplace
        run: bash .github/scripts/install-local-pkg.sh adlaplace

      - name: Check adlaplace (plain)
        uses: r-lib/actions/check-r-package@v2
        with:
          # Our check dirs live at ../.ci-check/; the action's failure-time
          # artifact upload cannot handle '..' in paths, so keep it off.
          upload-results: never
          working-directory: adlaplace
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"../.ci-check/adlaplace-plain"'
          artifact-name: ${{ matrix.config.id }}-pass1-adlaplace-plain

      - name: Check adlaplace (as-cran)
        if: runner.os != 'Windows'
        uses: r-lib/actions/check-r-package@v2
        with:
          # Our check dirs live at ../.ci-check/; the action's failure-time
          # artifact upload cannot handle '..' in paths, so keep it off.
          upload-results: never
          working-directory: adlaplace
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"../.ci-check/adlaplace-as-cran"'
          artifact-name: ${{ matrix.config.id }}-pass1-adlaplace-as-cran

      # ----- adlaplaceExample -----
      - name: Build and install adlaplaceExample
        run: bash .github/scripts/install-local-pkg.sh adlaplaceExample

      - name: Check adlaplaceExample (plain)
        uses: r-lib/actions/check-r-package@v2
        with:
          # Our check dirs live at ../.ci-check/; the action's failure-time
          # artifact upload cannot handle '..' in paths, so keep it off.
          upload-results: never
          working-directory: adlaplaceExample
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"../.ci-check/adlaplaceExample-plain"'
          artifact-name: ${{ matrix.config.id }}-pass1-adlaplaceExample-plain

      - name: Check adlaplaceExample (as-cran)
        if: runner.os != 'Windows'
        uses: r-lib/actions/check-r-package@v2
        with:
          # Our check dirs live at ../.ci-check/; the action's failure-time
          # artifact upload cannot handle '..' in paths, so keep it off.
          upload-results: never
          working-directory: adlaplaceExample
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"../.ci-check/adlaplaceExample-as-cran"'
          artifact-name: ${{ matrix.config.id }}-pass1-adlaplaceExample-as-cran

      # ----- adlaplaceHgp -----
      - name: Build and install adlaplaceHgp
        run: bash .github/scripts/install-local-pkg.sh adlaplaceHgp

      - name: Check adlaplaceHgp (plain)
        uses: r-lib/actions/check-r-package@v2
        with:
          # Our check dirs live at ../.ci-check/; the action's failure-time
          # artifact upload cannot handle '..' in paths, so keep it off.
          upload-results: never
          working-directory: adlaplaceHgp
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual")'
          check-dir: '"../.ci-check/adlaplaceHgp-plain"'
          artifact-name: ${{ matrix.config.id }}-pass1-adlaplaceHgp-plain

      - name: Check adlaplaceHgp (as-cran)
        if: runner.os != 'Windows'
        uses: r-lib/actions/check-r-package@v2
        with:
          # Our check dirs live at ../.ci-check/; the action's failure-time
          # artifact upload cannot handle '..' in paths, so keep it off.
          upload-results: never
          working-directory: adlaplaceHgp
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual")'
          check-dir: '"../.ci-check/adlaplaceHgp-as-cran"'
          artifact-name: ${{ matrix.config.id }}-pass1-adlaplaceHgp-as-cran

      # ----- adlaplaceGrf -----
      - name: Build and install adlaplaceGrf
        run: bash .github/scripts/install-local-pkg.sh adlaplaceGrf

      - name: Check adlaplaceGrf (plain)
        uses: r-lib/actions/check-r-package@v2
        with:
          # Our check dirs live at ../.ci-check/; the action's failure-time
          # artifact upload cannot handle '..' in paths, so keep it off.
          upload-results: never
          working-directory: adlaplaceGrf
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"../.ci-check/adlaplaceGrf-plain"'
          artifact-name: ${{ matrix.config.id }}-pass1-adlaplaceGrf-plain

      - name: Check adlaplaceGrf (as-cran)
        if: runner.os != 'Windows'
        uses: r-lib/actions/check-r-package@v2
        with:
          # Our check dirs live at ../.ci-check/; the action's failure-time
          # artifact upload cannot handle '..' in paths, so keep it off.
          upload-results: never
          working-directory: adlaplaceGrf
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"../.ci-check/adlaplaceGrf-as-cran"'
          artifact-name: ${{ matrix.config.id }}-pass1-adlaplaceGrf-as-cran

      # ----- hpolcc -----
      - name: Build and install hpolcc
        run: bash .github/scripts/install-local-pkg.sh hpolcc

      - name: Check hpolcc (plain)
        uses: r-lib/actions/check-r-package@v2
        with:
          # Our check dirs live at ../.ci-check/; the action's failure-time
          # artifact upload cannot handle '..' in paths, so keep it off.
          upload-results: never
          working-directory: hpolcc
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"../.ci-check/hpolcc-plain"'
          artifact-name: ${{ matrix.config.id }}-pass1-hpolcc-plain

      - name: Check hpolcc (as-cran)
        if: runner.os != 'Windows'
        uses: r-lib/actions/check-r-package@v2
        with:
          # Our check dirs live at ../.ci-check/; the action's failure-time
          # artifact upload cannot handle '..' in paths, so keep it off.
          upload-results: never
          working-directory: hpolcc
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"../.ci-check/hpolcc-as-cran"'
          artifact-name: ${{ matrix.config.id }}-pass1-hpolcc-as-cran

      # =====================================================================
      # Pass 2 (macOS only): install libomp, rebuild+install+check each package
      # =====================================================================

      - name: Install OpenMP (macOS, second pass)
        if: runner.os == 'macOS'
        run: brew install libomp

      # ----- RCppAD (OpenMP) -----
      - name: Build and install RCppAD with OpenMP
        if: runner.os == 'macOS'
        run: bash .github/scripts/install-local-pkg.sh RCppAD

      - name: Check RCppAD with OpenMP (plain)
        if: runner.os == 'macOS'
        uses: r-lib/actions/check-r-package@v2
        with:
          # Our check dirs live at ../.ci-check/; the action's failure-time
          # artifact upload cannot handle '..' in paths, so keep it off.
          upload-results: never
          working-directory: RCppAD
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual")'
          check-dir: '"../.ci-check/RCppAD-plain-omp"'
          artifact-name: macos-pass2-RCppAD-plain

      - name: Check RCppAD with OpenMP (as-cran)
        if: runner.os == 'macOS'
        uses: r-lib/actions/check-r-package@v2
        with:
          # Our check dirs live at ../.ci-check/; the action's failure-time
          # artifact upload cannot handle '..' in paths, so keep it off.
          upload-results: never
          working-directory: RCppAD
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual")'
          check-dir: '"../.ci-check/RCppAD-as-cran-omp"'
          artifact-name: macos-pass2-RCppAD-as-cran

      # ----- adlaplace (OpenMP) -----
      - name: Build and install adlaplace with OpenMP
        if: runner.os == 'macOS'
        run: bash .github/scripts/install-local-pkg.sh adlaplace

      - name: Diagnose OpenMP install (macOS pass 2)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          echo "== brew libomp =="
          brew --prefix libomp
          ls -la "$(brew --prefix libomp)/lib" | head -n 20
          echo "== has_openmp =="
          Rscript -e 'library(adlaplace); print(adlaplace::has_openmp())'
          echo "== otool -L adlaplace.so =="
          so=$(Rscript -e 'cat(list.files(system.file("libs", package="adlaplace"), pattern="[.]so$", full.names=TRUE, recursive=TRUE)[1])')
          echo "so=$so"
          otool -L "$so" | head -n 40
          echo "== fresh-process OpenMP smoke =="
          Rscript --vanilla -e '
            library(adlaplace)
            stopifnot(isTRUE(adlaplace::has_openmp()))
            set.seed(2)
            n <- 40L
            dat <- data.frame(
              y = rpois(n, 2), x = runif(n),
              g = factor(rep(seq_len(4L), length.out = n))
            )
            md <- adlaplace::model_data(
              data = dat,
              formula = adlaplace::nbinom(y, init = 0.2) ~ x + adlaplace::iid(g, init = 0.2)
            )
            config <- list(
              transform_theta = TRUE,
              shards = adlaplace::ad_shards(md$data$A, num_shards = 8L),
              verbose = FALSE
            )
            af <- adlaplace::ad_fun(md, config, num_threads = 2L)
            ll <- adlaplace::log_lik_laplace(
              x = md$data$info$parameters$init, ad_fun = af, config = config,
              control = list(maxit = 3L, report.level = 0, report.freq = 0),
              deriv = TRUE
            )
            stopifnot(is.finite(ll$log_lik))
            cat("fresh-process smoke OK\n")
          '

      - name: Check adlaplace with OpenMP (plain)
        if: runner.os == 'macOS'
        env:
          # Keep more vignette rebuild output if Abort trap returns.
          _R_CHECK_VIGNETTES_NLINES_: "50"
        uses: r-lib/actions/check-r-package@v2
        with:
          # Our check dirs live at ../.ci-check/; the action's failure-time
          # artifact upload cannot handle '..' in paths, so keep it off.
          upload-results: never
          working-directory: adlaplace
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"../.ci-check/adlaplace-plain-omp"'
          artifact-name: macos-pass2-adlaplace-plain

      - name: Check adlaplace with OpenMP (as-cran)
        if: runner.os == 'macOS'
        uses: r-lib/actions/check-r-package@v2
        with:
          # Our check dirs live at ../.ci-check/; the action's failure-time
          # artifact upload cannot handle '..' in paths, so keep it off.
          upload-results: never
          working-directory: adlaplace
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"../.ci-check/adlaplace-as-cran-omp"'
          artifact-name: macos-pass2-adlaplace-as-cran

      # ----- adlaplaceExample (OpenMP) -----
      - name: Build and install adlaplaceExample with OpenMP
        if: runner.os == 'macOS'
        run: bash .github/scripts/install-local-pkg.sh adlaplaceExample

      - name: Check adlaplaceExample with OpenMP (plain)
        if: runner.os == 'macOS'
        uses: r-lib/actions/check-r-package@v2
        with:
          # Our check dirs live at ../.ci-check/; the action's failure-time
          # artifact upload cannot handle '..' in paths, so keep it off.
          upload-results: never
          working-directory: adlaplaceExample
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"../.ci-check/adlaplaceExample-plain-omp"'
          artifact-name: macos-pass2-adlaplaceExample-plain

      - name: Check adlaplaceExample with OpenMP (as-cran)
        if: runner.os == 'macOS'
        uses: r-lib/actions/check-r-package@v2
        with:
          # Our check dirs live at ../.ci-check/; the action's failure-time
          # artifact upload cannot handle '..' in paths, so keep it off.
          upload-results: never
          working-directory: adlaplaceExample
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"../.ci-check/adlaplaceExample-as-cran-omp"'
          artifact-name: macos-pass2-adlaplaceExample-as-cran

      # ----- adlaplaceHgp (OpenMP) -----
      - name: Build and install adlaplaceHgp with OpenMP
        if: runner.os == 'macOS'
        run: bash .github/scripts/install-local-pkg.sh adlaplaceHgp

      - name: Check adlaplaceHgp with OpenMP (plain)
        if: runner.os == 'macOS'
        uses: r-lib/actions/check-r-package@v2
        with:
          # Our check dirs live at ../.ci-check/; the action's failure-time
          # artifact upload cannot handle '..' in paths, so keep it off.
          upload-results: never
          working-directory: adlaplaceHgp
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual")'
          check-dir: '"../.ci-check/adlaplaceHgp-plain-omp"'
          artifact-name: macos-pass2-adlaplaceHgp-plain

      - name: Check adlaplaceHgp with OpenMP (as-cran)
        if: runner.os == 'macOS'
        uses: r-lib/actions/check-r-package@v2
        with:
          # Our check dirs live at ../.ci-check/; the action's failure-time
          # artifact upload cannot handle '..' in paths, so keep it off.
          upload-results: never
          working-directory: adlaplaceHgp
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual")'
          check-dir: '"../.ci-check/adlaplaceHgp-as-cran-omp"'
          artifact-name: macos-pass2-adlaplaceHgp-as-cran

      # ----- adlaplaceGrf (OpenMP) -----
      - name: Build and install adlaplaceGrf with OpenMP
        if: runner.os == 'macOS'
        run: bash .github/scripts/install-local-pkg.sh adlaplaceGrf

      - name: Check adlaplaceGrf with OpenMP (plain)
        if: runner.os == 'macOS'
        uses: r-lib/actions/check-r-package@v2
        with:
          # Our check dirs live at ../.ci-check/; the action's failure-time
          # artifact upload cannot handle '..' in paths, so keep it off.
          upload-results: never
          working-directory: adlaplaceGrf
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"../.ci-check/adlaplaceGrf-plain-omp"'
          artifact-name: macos-pass2-adlaplaceGrf-plain

      - name: Check adlaplaceGrf with OpenMP (as-cran)
        if: runner.os == 'macOS'
        uses: r-lib/actions/check-r-package@v2
        with:
          # Our check dirs live at ../.ci-check/; the action's failure-time
          # artifact upload cannot handle '..' in paths, so keep it off.
          upload-results: never
          working-directory: adlaplaceGrf
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"../.ci-check/adlaplaceGrf-as-cran-omp"'
          artifact-name: macos-pass2-adlaplaceGrf-as-cran

      # ----- hpolcc (OpenMP) -----
      - name: Build and install hpolcc with OpenMP
        if: runner.os == 'macOS'
        run: bash .github/scripts/install-local-pkg.sh hpolcc

      - name: Check hpolcc with OpenMP (plain)
        if: runner.os == 'macOS'
        uses: r-lib/actions/check-r-package@v2
        with:
          # Our check dirs live at ../.ci-check/; the action's failure-time
          # artifact upload cannot handle '..' in paths, so keep it off.
          upload-results: never
          working-directory: hpolcc
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"../.ci-check/hpolcc-plain-omp"'
          artifact-name: macos-pass2-hpolcc-plain

      - name: Check hpolcc with OpenMP (as-cran)
        if: runner.os == 'macOS'
        uses: r-lib/actions/check-r-package@v2
        with:
          # Our check dirs live at ../.ci-check/; the action's failure-time
          # artifact upload cannot handle '..' in paths, so keep it off.
          upload-results: never
          working-directory: hpolcc
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"../.ci-check/hpolcc-as-cran-omp"'
          artifact-name: macos-pass2-hpolcc-as-cran

      # =====================================================================
      # Linux CRAN-like only: install INLA, re-check adlaplaceGrf (vignettes)
      # =====================================================================

      # INLA pulls in units (and friends); the R-hub image does not ship udunits2.
      - name: Install INLA system dependencies
        if: ${{ matrix.config.id == 'ubuntu-cran' }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libudunits2-0 libudunits2-dev

      - name: Install INLA
        if: ${{ matrix.config.id == 'ubuntu-cran' }}
        shell: Rscript {0}
        run: |
          install.packages(
            "INLA",
            repos = c(
              getOption("repos"),
              INLA = "https://inla.r-inla-download.org/R/testing"
            ),
            dependencies = TRUE
          )
          stopifnot(requireNamespace("INLA"))

      - name: Check adlaplaceGrf with INLA (plain)
        if: ${{ matrix.config.id == 'ubuntu-cran' }}
        uses: r-lib/actions/check-r-package@v2
        with:
          # Our check dirs live at ../.ci-check/; the action's failure-time
          # artifact upload cannot handle '..' in paths, so keep it off.
          upload-results: never
          working-directory: adlaplaceGrf
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"../.ci-check/adlaplaceGrf-plain-inla"'
          artifact-name: ubuntu-cran-adlaplaceGrf-inla-plain

      - name: Check adlaplaceGrf with INLA (as-cran)
        if: ${{ matrix.config.id == 'ubuntu-cran' }}
        uses: r-lib/actions/check-r-package@v2
        with:
          # Our check dirs live at ../.ci-check/; the action's failure-time
          # artifact upload cannot handle '..' in paths, so keep it off.
          upload-results: never
          working-directory: adlaplaceGrf
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check-dir: '"../.ci-check/adlaplaceGrf-as-cran-inla"'
          artifact-name: ubuntu-cran-adlaplaceGrf-inla-as-cran

      # =====================================================================
      # Ubuntu only: stage vignette HTML for GitHub Pages
      # =====================================================================

      # Static _site/ does not need actions/configure-pages (that action requires
      # Pages to already be enabled and was failing the ubuntu check job).
      # Repo setting: Settings → Pages → Source = GitHub Actions.
      - name: Stage vignette site
        if: ${{ matrix.config.id == 'ubuntu-cran' && success() }}
        run: bash .github/scripts/stage-vignette-site.sh

      - name: Upload Pages artifact
        if: ${{ matrix.config.id == 'ubuntu-cran' && success() }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy-docs:
    name: Deploy vignette site
    needs: R-CMD-check
    if: ${{ success() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
