# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Checks local packages in order:
#   RCppAD → adlaplace → adlaplaceExample → adlaplaceHgp → adlaplaceGrf → hpolcc
# Each OS × R matrix cell runs twice: plain R CMD check and --as-cran.
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}, ${{ matrix.config.check }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release', check: plain, id: 'macos-plain'}
          - {os: macos-latest, r: 'release', check: as-cran, id: 'macos-as-cran'}
          - {os: ubuntu-latest, r: 'release', check: plain, id: 'ubuntu-plain'}
          - {os: ubuntu-latest, r: 'release', check: as-cran, id: 'ubuntu-as-cran'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Set check args
        id: check-args
        run: |
          if [ "${{ matrix.config.check }}" = "as-cran" ]; then
            echo 'args=c("--no-manual", "--as-cran")' >> "$GITHUB_OUTPUT"
          else
            echo 'args=c("--no-manual")' >> "$GITHUB_OUTPUT"
          fi

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: RCppAD
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: RCppAD
          upload-snapshots: true
          args: ${{ steps.check-args.outputs.args }}
          build_args: 'c("--no-manual")'

      - name: Install RCppAD
        run: R CMD INSTALL RCppAD

      - name: Install OpenMP
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libomp-dev

      - name: Install OpenMP
        if: runner.os == 'macOS'
        run: brew install libomp

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Install TinyTeX extras
        run: tlmgr install makeindex

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: adlaplace
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: adlaplace
          upload-snapshots: true
          args: ${{ steps.check-args.outputs.args }}
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      - name: Install adlaplace
        run: R CMD INSTALL adlaplace

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: adlaplaceExample
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: adlaplaceExample
          upload-snapshots: true
          args: ${{ steps.check-args.outputs.args }}
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: adlaplaceHgp
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: adlaplaceHgp
          upload-snapshots: true
          args: ${{ steps.check-args.outputs.args }}
          build_args: 'c("--no-manual")'

      - name: Install adlaplaceHgp
        run: R CMD INSTALL adlaplaceHgp

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: adlaplaceGrf
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: adlaplaceGrf
          upload-snapshots: true
          args: ${{ steps.check-args.outputs.args }}
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: hpolcc
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: hpolcc
          upload-snapshots: true
          args: ${{ steps.check-args.outputs.args }}
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
